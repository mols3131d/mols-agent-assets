[env]
PYTHONUTF8 = "1"
_.file = ".env"

# CLI tool version authority. Exact pins guarantee zero-drift setup.
# Tool defaults, version preferences and exceptions: docs/tools/README.md
[tools]
uv = "0.12.1"
node = "24.19.0"
rumdl = "0.2.54"
lefthook = "2.1.10"
"npm:@biomejs/biome" = "2.5.6"
"npm:rulesync" = "40.2.0"
"npm:skills" = "1.5.23"

[settings]
task.run_auto_install = false
lockfile = true

[tasks.setup]
description = "Reconcile pinned tools and locked Python; leave shared integrations manual"
raw_args = true
run = "uv run --no-project --no-python-downloads python scripts/development_bootstrap.py setup"

[tasks.update]
description = "Update Python within declared constraints; retain exact tool and asset pins"
raw_args = true
run = "uv run --no-project --no-python-downloads python scripts/development_bootstrap.py update"

[tasks.skills-sync]
description = "Sync locked external Skills through source-native installers"
run = "uv run --locked --no-default-groups python scripts/agent_assets/skills_sync.py"

[tasks.generated-sync]
description = "Regenerate committed indexes and routes"
run = "uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_sync"

[tasks.generated-validate]
description = "Validate committed indexes and routes without writing"
run = "uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_validate"

[tasks.format]
description = "Format the entire repository"
run = [
  "uv run --locked --no-default-groups --group dev ruff check --fix .",
  "uv run --locked --no-default-groups --group dev ruff format .",
  "rumdl fmt .",
  "rumdl check --fix .",
  "biome format --write .",
]

[tasks.format-changed]
description = "Format modified and untracked repository files"
run = "uv run --locked --no-default-groups --group dev python scripts/changed_files_format.py"

[tasks.check]
description = "Validate the repository toolchain and lock state"
run = [
  "uv --version",
  "node --version",
  "rumdl version",
  "lefthook version",
  "biome --version",
  "rulesync --version",
  "skills --version",
  "uv lock --check",
  "uv run --locked --no-default-groups python scripts/agent_assets/skills_sync.py --dry-run",
  "lefthook validate",
  "biome check biome.json .vscode/tasks.json",
]

[tasks.test]
description = "Run repository tests"
run = "uv run --locked --no-default-groups --group test pytest"

# Task names do not grow with evaluation fixtures; Promptfoo owns -c and filter flags.
[tasks.eval]
description = "Run a selected Promptfoo configuration with native CLI arguments"
raw_args = true
run = "uv run --locked --no-default-groups --group test python scripts/agent_assets/promptfoo_run.py eval"

[tasks.rulesync-doctor]
description = "Validate the reusable Rulesync workspace configuration"
dir = "src/rulesync"
raw_args = true
run = "rulesync doctor --strict"

[tasks.rulesync-preview]
description = "Preview reusable Rulesync projections without writing"
dir = "src/rulesync"
raw_args = true
run = "rulesync generate --dry-run"

[tasks.rulesync-validate]
description = "Validate reusable Rulesync configuration and projections"
run = "uv run --locked --no-default-groups python scripts/agent_assets/rulesync_validate.py"

# Local diagnostics do not install or upgrade. This reports the selected project tools
# and checks lock consistency; it is not a guarantee of full environment readiness.
[tasks.preflight]
description = "Inspect project tool selection and Python lock without updating"
run = [
  "mise ls --project --json",
  "uv lock --check",
]

# Network lookup only when explicitly requested; availability is not a merge gate.
[tasks.outdated]
description = "Report newer project tool releases without upgrading"
run = "mise outdated --no-global --bump --json"
