[tools]
uv = "0.12.1"
node = "24.19.0"
rumdl = "0.2.54"
lefthook = "2.1.10"
"npm:@biomejs/biome" = "2.5.6"
"npm:rulesync" = "16.5.0"
"npm:skills" = "1.5.23"

[tasks.setup]
description = "Install project dependencies, Agent Skills, and Git hooks"
run = [
  "uv sync --all-groups",
  "rulesync install --frozen",
  "rulesync generate",
  "uv run python scripts/sync_agent_skills.py",
  "lefthook install",
]

[tasks.skills-sync]
description = "Sync locked external Skills through source-native installers"
run = "uv run python scripts/sync_agent_skills.py"

[tasks.generated-sync]
description = "Regenerate committed indexes and routes"
run = "uv run python -m scripts.sync_generated_artifacts"

[tasks.format]
description = "Format the entire repository"
run = [
  "uv run ruff format .",
  "uv run ruff check --fix .",
  "rumdl fmt .",
  "rumdl check --fix .",
  "biome format --write .",
]

[tasks.format-changed]
description = "Format modified and untracked repository files"
run = "uv run --locked --no-default-groups --group dev python scripts/format_changed.py"

[tasks.check]
description = "Validate the repository toolchain and lock state"
run = [
  "uv --version",
  "node --version",
  "rumdl version",
  "lefthook version",
  "biome --version",
  "rulesync --version",
  "skills --version",
  "uv run python scripts/sync_agent_skills.py --dry-run",
  "uv lock --check",
  "lefthook validate",
  "biome check biome.json package.json .vscode/tasks.json",
]

[tasks.test]
description = "Run repository tests"
run = "uv run pytest"

[tasks.eval-mols-rpi-smoke]
description = "mols-rpi Promptfoo fixture smoke를 local에서 실행"
run = "npm run eval:promptfoo:mols-rpi:smoke"

[tasks.eval-mols-rpi]
description = "mols-rpi Promptfoo runtime evaluation을 local에서 실행"
run = "npm run eval:promptfoo:mols-rpi"
