[tools]
uv = "0.12.1"
node = "24.19.0"
rumdl = "0.2.54"
lefthook = "2.1.10"
"npm:@biomejs/biome" = "2.5.6"
"npm:rulesync" = "latest"
"npm:skills" = "1.5.23"

[tasks.setup]
description = "Install project dependencies, Agent Skills, and Git hooks"
run = [
  "uv sync --all-groups",
  "rulesync install --frozen",
  "rulesync generate",
  "uv run python scripts/agent_assets/skills_sync.py",
  "lefthook install",
]

[tasks.skills-sync]
description = "Sync locked external Skills through source-native installers"
run = "uv run python scripts/agent_assets/skills_sync.py"

[tasks.generated-sync]
description = "Regenerate committed indexes and routes"
run = "uv run python -m scripts.generated_artifacts_sync"

[tasks.format]
description = "Format the entire repository"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "rumdl fmt .",
  "rumdl check --fix .",
  "biome format --write .",
]

[tasks.format-changed]
description = "Format modified and untracked repository files"
run = "uv run --locked --no-default-groups --group dev python scripts/changed_files_format.py"

[tasks.check]
description = "Validate the repository toolchain and lock state"
run = [
  "uv --version",
  "node --version",
  "rumdl version",
  "lefthook version",
  "biome --version",
  "rulesync --version",
  "skills --version",
  "uv lock --check",
  "uv run --locked --no-default-groups python scripts/agent_assets/skills_sync.py --dry-run",
  "lefthook validate",
  "biome check biome.json package.json .vscode/tasks.json",
]

[tasks.test]
description = "Run repository tests"
run = "uv run --locked --no-default-groups --group test pytest"

[tasks.eval-mols-rpi-smoke]
description = "mols-rpi Promptfoo fixture smoke를 local에서 실행"
run = "npm run eval:promptfoo:mols-rpi:smoke"

[tasks.eval-mols-rpi]
description = "mols-rpi Trigger + Behavior Promptfoo runtime eval을 local에서 실행"
run = "npm run eval:promptfoo:mols-rpi"

[tasks.eval-mols-rpi-trigger]
description = "mols-rpi Trigger Promptfoo runtime eval만 local에서 실행"
run = "npm run eval:promptfoo:mols-rpi:trigger"

[tasks.eval-mols-rpi-behavior]
description = "mols-rpi Behavior Promptfoo runtime eval만 local에서 실행"
run = "npm run eval:promptfoo:mols-rpi:behavior"
