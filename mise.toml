[env]
PYTHONUTF8 = "1"

# CLI tool version authority. Exact pins guarantee zero-drift setup.
# Version policies (Case 1~4) and update boundaries: docs/references/tooling/mise.md
[tools]
uv = "0.12.1"
node = "24.19.0"
rumdl = "0.2.54"
lefthook = "2.1.10"
"npm:@biomejs/biome" = "2.5.6"
"npm:rulesync" = "40.2.0"
"npm:skills" = "1.5.23"

[settings]
task.run_auto_install = false

[tasks.setup]
description = "Reconcile pinned tools and locked Python; leave shared integrations manual"
raw_args = true
run = "uv run --no-project --no-python-downloads python scripts/development_bootstrap.py setup"

[tasks.update]
description = "Update Python within declared constraints; retain exact tool and asset pins"
raw_args = true
run = "uv run --no-project --no-python-downloads python scripts/development_bootstrap.py update"

[tasks.skills-sync]
description = "Sync locked external Skills through source-native installers"
run = "uv run python scripts/agent_assets/skills_sync.py"

[tasks.generated-sync]
description = "Regenerate committed indexes and routes"
run = "uv run python -m scripts.generated_artifacts_sync"

[tasks.generated-validate]
description = "Validate committed indexes and routes without writing"
run = "uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_validate"

[tasks.format]
description = "Format the entire repository"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "rumdl fmt .",
  "rumdl check --fix .",
  "biome format --write .",
]

[tasks.format-changed]
description = "Format modified and untracked repository files"
run = "uv run --locked --no-default-groups --group dev python scripts/changed_files_format.py"

[tasks.check]
description = "Validate the repository toolchain and lock state"
run = [
  "uv --version",
  "node --version",
  "rumdl version",
  "lefthook version",
  "biome --version",
  "rulesync --version",
  "skills --version",
  "uv lock --check",
  "uv run --locked --no-default-groups python scripts/agent_assets/skills_sync.py --dry-run",
  "lefthook validate",
  "biome check biome.json package.json .vscode/tasks.json",
]

[tasks.test]
description = "Run repository tests"
run = "uv run --locked --no-default-groups --group test pytest"

[tasks.eval-mols-test-design]
description = "mols-test-design local Trigger + Behavior runtime eval"
run = "npm run eval:promptfoo:mols-test-design"

[tasks.eval-mols-test-design-trigger]
description = "mols-test-design local Trigger eval"
run = "npm run eval:promptfoo:mols-test-design:trigger"

[tasks.eval-mols-test-design-behavior]
description = "mols-test-design local Behavior eval"
run = "npm run eval:promptfoo:mols-test-design:behavior"

[tasks.eval-mols-loops-smoke]
description = "mols-loops Promptfoo fixture smoke를 local에서 실행"
run = "npm run eval:promptfoo:mols-loops:smoke"

[tasks.eval-mols-loops]
description = "mols-loops Trigger + Behavior Promptfoo runtime eval을 local에서 실행"
run = "npm run eval:promptfoo:mols-loops"

[tasks.eval-mols-loops-trigger]
description = "mols-loops Trigger Promptfoo runtime eval만 local에서 실행"
run = "npm run eval:promptfoo:mols-loops:trigger"

[tasks.eval-mols-loops-behavior]
description = "mols-loops Behavior Promptfoo runtime eval만 local에서 실행"
run = "npm run eval:promptfoo:mols-loops:behavior"
