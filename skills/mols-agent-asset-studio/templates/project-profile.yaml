version: 1
project:
  name: "<project-name>"
  root: "."
  language: "ko"
asset_roots:
  canonical:
    - "src/skills"
  runtime:
    - ".github/skills"
runtimes:
  - "github-copilot"
  - "openai-codex"
sources_of_truth:
  user_intent: true
  specifications: []
  architecture: []
  decisions: []
validation:
  local_commands:
    - id: "skill-tests"
      argv: ["python", "-m", "pytest", "-q", "tests/skills"]
      cwd: "."
      timeout_sec: 120
      required: true
  ci_lanes: []
policy:
  allow_network: false
  allow_package_install: false
  allow_publish: false
  preserve_attribution: true
