# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: mols-dev-env-bootstrap-design local Trigger and Behavior capability eval

prompts:
  - file://skill-chat.json

providers:
  - id: "ollama:chat:{{ env.PROMPTFOO_RUNTIME_MODEL }}"
    label: mols-dev-env-bootstrap-design-trigger
    config:
      temperature: 0
      format: json
  - id: "ollama:chat:{{ env.PROMPTFOO_RUNTIME_MODEL }}"
    label: mols-dev-env-bootstrap-design-behavior
    config:
      temperature: 0

tests:
  - path: file://../../scripts/agent_assets/skills_promptfoo.py:generate_native_tests
    config:
      skill: mols-dev-env-bootstrap-design
      suite: trigger
      semantic: false
  - path: file://../../scripts/agent_assets/skills_promptfoo.py:generate_native_tests
    config:
      skill: mols-dev-env-bootstrap-design
      suite: behavior
      semantic: true
      rubric_threshold: 0.8

sharing: false
writeLatestResults: false
commandLineOptions:
  cache: false
  write: false
  noShare: true
  maxConcurrency: 1
