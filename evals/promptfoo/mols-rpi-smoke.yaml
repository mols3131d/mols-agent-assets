# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: mols-rpi Promptfoo Trigger and Behavior plumbing smoke

prompts:
  - "{{task}}"

providers:
  - id: file://../../scripts/agent_assets/promptfoo_mols_rpi.py:call_api
    label: mols-rpi-trigger
    config:
      mode: fixture
      suite: trigger
  - id: file://../../scripts/agent_assets/promptfoo_mols_rpi.py:call_api
    label: mols-rpi-behavior
    config:
      mode: fixture
      suite: behavior

tests:
  - path: file://../../scripts/agent_assets/promptfoo_mols_rpi.py:generate_tests
    config:
      suite: trigger
      provider_label: mols-rpi-trigger
      semantic: false
  - path: file://../../scripts/agent_assets/promptfoo_mols_rpi.py:generate_tests
    config:
      suite: behavior
      provider_label: mols-rpi-behavior
      semantic: false

sharing: false
writeLatestResults: false
commandLineOptions:
  cache: false
  write: false
  noShare: true
  maxConcurrency: 1
