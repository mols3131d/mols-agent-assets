# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: mols-stdd local trigger and behavior model evaluation

prompts:
  - file://skill-chat.json

providers:
  - id: repository-selected-runtime
    label: mols-stdd-trigger
  - id: repository-selected-runtime
    label: mols-stdd-behavior

tests:
  - path: file://../../scripts/agent_assets/skills_promptfoo.py:generate_native_tests
    config:
      skill: mols-stdd
      suite: trigger
      semantic: false
  - path: file://../../scripts/agent_assets/skills_promptfoo.py:generate_native_tests
    config:
      skill: mols-stdd
      suite: behavior
      semantic: true
      rubric_threshold: 0.8
      omit_reference_checks: true

sharing: false
writeLatestResults: false
commandLineOptions:
  cache: false
  write: false
  noShare: true
  maxConcurrency: 1
