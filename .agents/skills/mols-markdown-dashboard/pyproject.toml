[project]
name = "mols-markdown-dashboard"
version = "0.3.0"
description = "Generate evidence-backed development dashboards from compact YAML."
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "pyromark>=0.9.13,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.16.1,<1",
  "rumdl>=0.2.44,<1",
  "ty>=0.0.65,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
include = ["src", "scripts", "tests"]

[tool.ty.environment]
root = ["./src"]

[tool.rumdl]
line-length = 120
exclude = [".venv", ".pytest_cache", ".ruff_cache"]

[tool.rumdl.MD013]
code-blocks = false
tables = false
