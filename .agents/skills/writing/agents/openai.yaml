interface:
  display_name: writing
  short_description: '목적, 독자, 채널, 제약에 맞는 완성형 글을 기획하고 작성하며, 기존 글을 재작성하고 가독성을 개선하고 목적
    적합성을 리뷰한다. 이메일, 메시지, 공지, 문서, 보고서, 제안서, 게시물, 설명문, 스크립트 등 독자가 읽을 글의 완성본이나 구조화된 글쓰기
    계획이 필요할 때 사용한다. 단순 사실 질의, 요약만 하는 요청, 짧은 번역, 코드 작성, 문서 파일의 시각적 레이아웃·변환만 필요한 작업에는
    사용하지 않는다. Keywords: writing plan, draft, rewrite, edit, readability, critique,
    review, audience, purpose, tone, structure.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
