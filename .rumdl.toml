[global]
flavor = "gfm"
disable = ["MD013", "MD025", "MD041"]
exclude = [
  "**/.git/",
  "**/.tmp/",
  "**/tmp/",
  "**/archive/",
  "**/*.tmp.md",
  # --- --- --- ---  --- ---
  ".rumdl_cache/**",
  "node_modules/",
  "vendor/",
  "dist/",
  "build/",
  "target/**",
  "coverage/**",
  "site/**",
  "**/generated/**",
]

extend-enable = [
  "MD060",
  "MD070",
  "MD073",
  "MD080",
]

[MD004]
style = "dash"

[MD029]
style = "ordered"

[MD033]
disallowed-elements = ["gfm"]
fix = false

[MD048]
style = "backtick"

[MD057]
compact-paths = true
