glob_matcher: doublestar
no_tty: true

pre-commit:
  parallel: true
  commands:
    rumdl:
      glob: "**/*.md"
      run: uv run rumdl fmt {staged_files} && uv run rumdl check --fix {staged_files}
      stage_fixed: true
    ruff:
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: uv run python scripts/validate_commit_msg.py "{1}"

pre-push:
  commands:
    tests:
      run: uv run pytest
