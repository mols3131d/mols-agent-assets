glob_matcher: doublestar
no_tty: true

pre-commit:
  parallel: true
  commands:
    rumdl:
      glob: "**/*.md"
      run: mise exec -- rumdl fmt {staged_files} && mise exec -- rumdl check --fix {staged_files}
      stage_fixed: true
    ruff:
      glob: "**/*.py"
      run: mise exec -- uv run ruff check --fix {staged_files} && mise exec -- uv run ruff format {staged_files}
      stage_fixed: true
    biome:
      glob: "**/*.{json,jsonc,js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: mise exec -- biome check --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: mise exec -- uv run python scripts/validate_commit_msg.py "{1}"

pre-push:
  commands:
    repository-tests:
      # Root tests/ is the default correctness gate; skill-local .tests/ is tuning-only.
      run: mise exec -- uv run pytest
