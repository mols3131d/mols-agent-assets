name: Temporary mise tooling verification

on:
  push:
    branches:
      - chatbot/feat/mise-tooling
    paths:
      - mise.toml
      - .github/workflows/verify-mise-tooling-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install: false
          cache: false
      - name: Verify tooling
        shell: bash
        run: |
          set +e
          log=.mise-tooling-verification.log
          : > "$log"
          status=0

          run_check() {
            printf '\n$ %s\n' "$*" >> "$log"
            "$@" >> "$log" 2>&1
            code=$?
            printf 'exit=%s\n' "$code" >> "$log"
            if ((code != 0)); then
              status=$code
            fi
          }

          run_check mise install
          run_check uv --version
          run_check node --version
          run_check rumdl version
          run_check lefthook version
          run_check biome --version
          run_check rulesync --version
          run_check mise run check
          run_check npm run rulesync:doctor
          run_check uv run ruff check \
            tests/scripts/tooling/test_tool_ownership.py \
            tests/scripts/rumdl_main_autofix/test_generated_boundary.py
          run_check uv run --locked --no-default-groups --group test pytest -q \
            tests/scripts/tooling \
            tests/scripts/rumdl_main_autofix
          run_check rumdl check \
            docs/references/tooling/mise.md \
            docs/development/testing.md
          run_check mise run test

          if ((status == 0)); then
            printf '%s\n' "$GITHUB_SHA" > .mise-tooling-verified
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$log"
          [[ -f .mise-tooling-verified ]] && git add -- .mise-tooling-verified
          git commit -m "chore(tooling): record mise verification"
          git push origin HEAD:chatbot/feat/mise-tooling
          exit "$status"
