name: Temporary mise tooling verification

on:
  push:
    branches:
      - chatbot/feat/mise-tooling
    paths:
      - .github/workflows/verify-mise-tooling-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: false
      - name: Show managed tools
        run: |
          mise exec -- uv --version
          mise exec -- node --version
          mise exec -- rumdl --version
          mise exec -- lefthook version
          mise exec -- biome --version
      - name: Run static checks
        run: mise run check
      - name: Run tests
        run: mise run test
      - name: Record success
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > .mise-tooling-verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .mise-tooling-verified
          git commit -m "chore(tooling): record mise verification"
          git push origin HEAD:chatbot/feat/mise-tooling
