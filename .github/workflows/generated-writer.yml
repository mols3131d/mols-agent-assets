name: Trusted Generated Writer

# 활성화 제어용 Repository Variables:
#   - GENERATED_SYNC_WRITER_ENABLED: 'true'일 때만 활성화 (미설정 시 fail-closed)
#   - GENERATED_SYNC_WRITER_ALLOWED_BRANCHES: 쉼표/공백으로 구분한 정확한 브랜치 이름
# App 인증 정보는 main 브랜치로 제한된 Environment('generated-writeback')에 둔다.

on:
  workflow_run:
    workflows:
      - Sync Generated Artifacts
    types:
      - completed

concurrency:
  # A late completion for an older SHA must leave the newer SHA's pending run queued.
  group: >-
    generated-writer-${{ github.event.workflow_run.head_repository.id || github.repository_id }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}-${{ github.event.workflow_run.head_sha || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    name: Preflight Verification
    if: >-
      vars.GENERATED_SYNC_WRITER_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.head_branch != '' &&
      github.event.workflow_run.head_branch != null &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      should_write: ${{ steps.prepare.outputs.should_write }}
      artifact_id: ${{ steps.verify_run.outputs.artifact_id }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false

      - name: Verify workflow_run provenance and live HEAD
        id: verify_run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GENERATED_SYNC_WRITER_ENABLED: ${{ vars.GENERATED_SYNC_WRITER_ENABLED }}
          GENERATED_SYNC_WRITER_ALLOWED_BRANCHES: ${{ vars.GENERATED_SYNC_WRITER_ALLOWED_BRANCHES }}
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_writer verify-run

      - name: Download producer payload artifact
        if: steps.verify_run.outputs.should_continue == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.verify_run.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preflight-artifact
          skip-decompress: true

      - name: Validate artifact and stage candidate diff
        id: prepare
        if: steps.verify_run.outputs.should_continue == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GENERATED_SYNC_WRITER_ENABLED: ${{ vars.GENERATED_SYNC_WRITER_ENABLED }}
          GENERATED_SYNC_WRITER_ALLOWED_BRANCHES: ${{ vars.GENERATED_SYNC_WRITER_ALLOWED_BRANCHES }}
        run: >-
          uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_writer
          prepare-write
          --artifact-dir "${RUNNER_TEMP}/preflight-artifact"
          --extract-dir "${RUNNER_TEMP}/preflight-extracted"
          --target-dir "${RUNNER_TEMP}/preflight-repo"

  write:
    name: Write Generated Commit
    needs: preflight
    if: >-
      needs.preflight.outputs.should_write == 'true' &&
      vars.GENERATED_SYNC_WRITER_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: generated-writeback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false

      - name: Re-verify workflow_run provenance and live HEAD
        id: verify_run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GENERATED_SYNC_WRITER_ENABLED: ${{ vars.GENERATED_SYNC_WRITER_ENABLED }}
          GENERATED_SYNC_WRITER_ALLOWED_BRANCHES: ${{ vars.GENERATED_SYNC_WRITER_ALLOWED_BRANCHES }}
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_writer verify-run

      - name: Download producer payload artifact
        if: steps.verify_run.outputs.should_continue == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.verify_run.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/write-artifact
          skip-decompress: true

      - name: Re-validate artifact and stage candidate diff
        id: prepare
        if: steps.verify_run.outputs.should_continue == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GENERATED_SYNC_WRITER_ENABLED: ${{ vars.GENERATED_SYNC_WRITER_ENABLED }}
          GENERATED_SYNC_WRITER_ALLOWED_BRANCHES: ${{ vars.GENERATED_SYNC_WRITER_ALLOWED_BRANCHES }}
        run: >-
          uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_writer
          prepare-write
          --artifact-dir "${RUNNER_TEMP}/write-artifact"
          --extract-dir "${RUNNER_TEMP}/write-extracted"
          --target-dir "${RUNNER_TEMP}/write-repo"
          --state-file "${RUNNER_TEMP}/write-state.json"

      - name: Mint scoped GitHub App token
        id: app_token
        if: steps.prepare.outputs.should_write == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GENERATED_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.GENERATED_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and fast-forward push generated outputs
        if: steps.prepare.outputs.should_write == 'true'
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GENERATED_SYNC_WRITER_ENABLED: ${{ vars.GENERATED_SYNC_WRITER_ENABLED }}
          GENERATED_SYNC_WRITER_ALLOWED_BRANCHES: ${{ vars.GENERATED_SYNC_WRITER_ALLOWED_BRANCHES }}
        run: >-
          uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_writer
          commit-and-push
          --target-dir "${RUNNER_TEMP}/write-repo"
          --state-file "${RUNNER_TEMP}/write-state.json"
