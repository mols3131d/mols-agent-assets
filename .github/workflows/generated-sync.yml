name: Regenerate Projections

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'src/rulesync/.rulesync/skills/**'
      - 'src/rulesync/.rulesync/subagents/**'
      - 'scripts/**'
      - '.github/workflows/generated-sync.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'rulesync.lock'
      - 'rulesync.jsonc'
      - 'skills-lock.json'
      - '.agents/route/families.json'
      - '.agents/route/**/*.jsonl'
      - 'route/*.jsonl'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Generate and validate projections
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: '2026.10.25'
          install: false
          cache: true

      - name: Reconcile locked Skill selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise install node "npm:rulesync"
          mise exec -- rulesync install
          mise exec -- rulesync install --frozen

      - name: Regenerate projections in the runner
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts sync

      - name: Validate regenerated files
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts validate --all

      - name: Report generated changes for branch synchronization
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          changed = subprocess.check_output(["git", "diff", "--name-only", "-z"]).decode().split("\0")
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"]).decode().split("\0")
          for path in sorted(set(changed + untracked)):
              if not (path == "rulesync.lock" or
                      path.endswith(".jsonl") and path.startswith(("route/", ".agents/route/")) or
                      path.endswith("/INDEX.tsv") and path.startswith(("docs/", "catalog/"))):
                  continue
              file = Path(path)
              if not file.is_file():
                  print("SYNC_FILE " + json.dumps({"path": path, "part": 0, "content": None}))
                  continue
              content = file.read_text(encoding="utf-8")
              for part, start in enumerate(range(0, max(1, len(content)), 1500)):
                  print("SYNC_FILE " + json.dumps({"path": path, "part": part, "content": content[start:start + 1500]}, ensure_ascii=True))
          PY
