name: Sync Generated Artifacts

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'src/rulesync/.rulesync/skills/**'
      - 'src/rulesync/.rulesync/subagents/**'
      - 'scripts/**'
      - '.github/workflows/generated-sync.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'rulesync.lock'
      - 'rulesync.jsonc'
      - 'skills-lock.json'
      - '.agents/route/families.json'
      - '.agents/route/*.jsonl'
      - 'route/*.jsonl'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: >-
      startsWith(github.ref, 'refs/heads/') &&
      github.ref != 'refs/heads/main' &&
      github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Regenerate committed projections
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts sync

      - name: Validate generated projections
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts validate --all

      - name: Package read-only sync payload
        shell: bash
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: >-
          uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_producer
          package
          --output-dir "${RUNNER_TEMP}/generated-sync-payload"

      - name: Upload generated sync payload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-sync-payload
          path: ${{ runner.temp }}/generated-sync-payload
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 5
