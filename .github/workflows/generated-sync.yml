name: Regenerate Projections

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'src/rulesync/.rulesync/skills/**'
      - 'src/rulesync/.rulesync/subagents/**'
      - 'scripts/**'
      - '.github/workflows/generated-sync.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'rulesync.lock'
      - 'rulesync.jsonc'
      - 'skills-lock.json'
      - '.agents/route/families.json'
      - '.agents/route/**/*.jsonl'
      - 'route/*.jsonl'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Generate and validate projections
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Regenerate projections in the runner
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts sync

      - name: Validate regenerated files
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts validate --all
