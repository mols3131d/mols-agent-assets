name: Sync Generated Artifacts

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'docs/**'
      - '!docs/**/INDEX.tsv'
      - 'catalog/**'
      - '!catalog/INDEX.tsv'
      - 'src/rulesync/.rulesync/skills/**'
      - 'src/rulesync/.rulesync/subagents/**'
      - 'scripts/**'
      - 'rulesync.lock'
      - 'rulesync.jsonc'
      - 'skills-lock.json'
      - '.agents/route/families.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Regenerate committed projections
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts sync

      - name: Validate generated projections
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts validate --all

      - name: Stage generated outputs and detect changes
        id: changes
        shell: bash
        run: |
          git add -A -- docs catalog route .agents/route
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create scoped GitHub App token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GENERATED_FILES_APP_CLIENT_ID }}
          private-key: ${{ secrets.GENERATED_FILES_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit generated files to source branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m 'chore(generated): sync indexes and routes'
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
