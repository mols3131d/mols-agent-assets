name: Temporary AgentsMesh Sync

on:
  push:
    branches:
      - agent/add-adudeck-textbook-skills

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate AgentsMesh state
        run: npx agentsmesh generate --force
      - name: Normalize generated Markdown
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown < <(git ls-files -z -- '.github/skills/**/*.md' '.agents/skills/**/*.md')
          ((${#markdown[@]})) && uvx rumdl@0.2.6 fmt "${markdown[@]}" || true
      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git add -- .agentsmesh/.lock .github/skills .agents/skills
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate agentsmesh state"
          git push
