name: Targeted PR Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "inbox/README.md"
      - "src/rulesync/**"
      - "route/**"
      - "package.json"
      - "mise.toml"
      - "biome.json"
      - "lefthook.yml"
      - ".python-version"
      - ".vscode/tasks.json"
      - ".gitattributes"
      - ".rumdl.toml"
      - "evals/regression/**"
      - "evals/skills/**"
      - "tests/evals/**"
      - "tests/test_rulesync_source_isolation.py"
      - "tests/test_documentation_consistency.py"
      - "docs/**"
      - "tests/skills/**"
      - "tests/scripts/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/distribution-routes.yml"
      - ".github/workflows/rulesync.yml"
      - ".github/workflows/rumdl-main-autofix.yml"
      - ".github/workflows/targeted-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select affected tests
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(git diff --name-only -z HEAD^1 HEAD)
          declare -A root_targets=()
          tooling_changed=false

          add_isolation() {
            root_targets["tests/test_rulesync_source_isolation.py"]=1
          }

          add_documentation_consistency() {
            root_targets["tests/test_documentation_consistency.py"]=1
          }

          add_asset_docs() {
            root_targets["tests/scripts/asset_docs_placement"]=1
          }

          add_distribution_routes() {
            root_targets["tests/scripts/generate_distribution_routes"]=1
          }

          add_skill() {
            local name="$1"
            [[ -d "tests/skills/$name" ]] && root_targets["tests/skills/$name"]=1
            return 0
          }

          add_eval() {
            local name="$1"
            root_targets["tests/evals"]=1
            add_skill "$name"
            return 0
          }

          add_script() {
            local name="$1"
            [[ -d "tests/scripts/$name" ]] && root_targets["tests/scripts/$name"]=1
            return 0
          }

          for path in "${files[@]}"; do
            case "$path" in
              tests/skills/conftest.py)
                root_targets["tests/skills"]=1
                ;;
              tests/evals/*)
                root_targets["tests/evals"]=1
                ;;
              tests/scripts/conftest.py)
                root_targets["tests/scripts"]=1
                ;;
              .github/workflows/targeted-tests.yml)
                tooling_changed=true
                add_isolation
                add_documentation_consistency
                add_asset_docs
                add_distribution_routes
                add_script "rumdl_main_autofix"
                add_script "tooling"
                root_targets["tests/evals"]=1
                ;;
              .github/workflows/distribution-routes.yml|route/*)
                add_distribution_routes
                add_script "tooling"
                ;;
              .github/workflows/rulesync.yml)
                add_script "rumdl_main_autofix"
                add_script "tooling"
                ;;
              .gitattributes|.rumdl.toml|.github/workflows/rumdl-main-autofix.yml)
                add_script "rumdl_main_autofix"
                add_script "tooling"
                ;;
              mise.toml|biome.json|lefthook.yml|.python-version|.vscode/tasks.json|pyproject.toml|uv.lock)
                tooling_changed=true
                add_script "tooling"
                ;;
              README.md|AGENTS.md|inbox/README.md|tests/test_documentation_consistency.py)
                add_documentation_consistency
                ;;
              src/rulesync/.rulesync/skills/load-context-github/SKILL.md|src/rulesync/.rulesync/skills/load-context-github-mols/SKILL.md)
                name="${path#src/rulesync/.rulesync/skills/}"
                add_skill "${name%%/*}"
                add_isolation
                add_asset_docs
                add_distribution_routes
                ;;
              src/rulesync/.rulesync/skills/*)
                name="${path#src/rulesync/.rulesync/skills/}"
                add_skill "${name%%/*}"
                add_isolation
                add_asset_docs
                add_distribution_routes
                ;;
              tests/skills/*)
                name="${path#tests/skills/}"
                add_skill "${name%%/*}"
                ;;
              evals/skills/*)
                name="${path#evals/skills/}"
                add_eval "${name%%/*}"
                ;;
              docs/references/common/chatbot-compatibility.md)
                add_documentation_consistency
                ;;
              docs/references/tooling/rulesync.md)
                add_isolation
                add_asset_docs
                add_documentation_consistency
                ;;
              src/rulesync/.rulesync/rules/*|src/rulesync/.rulesync/subagents/*|src/rulesync/rulesync.jsonc|evals/regression/rulesync-source-isolation.json|tests/test_rulesync_source_isolation.py)
                add_isolation
                ;;
              package.json)
                tooling_changed=true
                add_isolation
                add_script "tooling"
                ;;
              docs/skills/*|docs/references/skills/*|docs/development/testing.md)
                add_asset_docs
                add_documentation_consistency
                ;;
              docs/*)
                add_documentation_consistency
                ;;
              tests/scripts/*)
                name="${path#tests/scripts/}"
                add_script "${name%%/*}"
                ;;
              scripts/*)
                name="${path#scripts/}"
                name="${name%.py}"
                add_script "${name%%/*}"
                ;;
            esac
          done

          if ((${#root_targets[@]})); then
            printf '%s\0' "${!root_targets[@]}" > /tmp/root-tests
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tooling=$tooling_changed" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        if: ${{ steps.scope.outputs.run == 'true' || steps.scope.outputs.tooling == 'true' }}
        uses: jdx/mise-action@v3
        with:
          install: false
          cache: true

      - name: Install uv
        if: ${{ steps.scope.outputs.run == 'true' && steps.scope.outputs.tooling != 'true' }}
        run: mise install uv

      - name: Validate repository tooling
        if: steps.scope.outputs.tooling == 'true'
        run: |
          mise install
          mise run check

      - name: Run central tests
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          [[ -f /tmp/root-tests ]] || exit 0
          mapfile -d '' targets < /tmp/root-tests
          uv run --locked --no-default-groups --group test pytest -q "${targets[@]}"
