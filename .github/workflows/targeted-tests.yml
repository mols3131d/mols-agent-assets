name: PR Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify change impact
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          tooling=false
          external_skills=false
          rulesync=false
          routes=false
          markdown=false
          promptfoo=false

          mapfile -d '' files < <(git diff --name-only -z HEAD^1 HEAD)
          for path in "${files[@]}"; do
            case "$path" in
              .github/workflows/targeted-tests.yml)
                tooling=true
                external_skills=true
                rulesync=true
                routes=true
                markdown=true
                promptfoo=true
                ;;
              mise.toml)
                tooling=true
                external_skills=true
                ;;
              skills-lock.json)
                external_skills=true
                ;;
              biome.json|lefthook.yml|.python-version|.vscode/tasks.json|pyproject.toml|uv.lock|package.json)
                tooling=true
                ;;
            esac

            case "$path" in
              src/rulesync/*|scripts/run_rulesync.py|package.json|mise.toml|.gitattributes|.rumdl.toml)
                rulesync=true
                ;;
            esac

            case "$path" in
              src/rulesync/.rulesync/skills/*/SKILL.md|scripts/generate_distribution_routes.py|route/skills.jsonl)
                routes=true
                ;;
            esac

            case "$path" in
              *.md)
                markdown=true
                ;;
            esac

            case "$path" in
              evals/promptfoo/*|evals/skills/mols-rpi/*|scripts/evals/*|src/rulesync/.rulesync/skills/mols-rpi/*|package.json|mise.toml)
                promptfoo=true
                ;;
            esac
          done

          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "external_skills=$external_skills" >> "$GITHUB_OUTPUT"
          echo "rulesync=$rulesync" >> "$GITHUB_OUTPUT"
          echo "routes=$routes" >> "$GITHUB_OUTPUT"
          echo "markdown=$markdown" >> "$GITHUB_OUTPUT"
          echo "promptfoo=$promptfoo" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: false
          cache: true

      - name: Install deterministic test tools
        run: mise install uv rumdl

      - name: Validate repository tooling
        if: steps.scope.outputs.tooling == 'true'
        run: |
          mise install
          mise run check

      - name: Validate external Skill lock
        if: steps.scope.outputs.external_skills == 'true'
        shell: bash
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          mise install "npm:skills"
          skills experimental_install
          git diff --exit-code -- skills-lock.json
          skills list --json --agent codex > /tmp/project-skills.json
          uv run --no-project python - <<'PY'
          import json
          from pathlib import Path

          skills = json.loads(Path("/tmp/project-skills.json").read_text())
          skill = next((item for item in skills if item["name"] == "humanize-korean"), None)
          if skill is None:
              raise SystemExit("humanize-korean was not installed")

          quick_rules = Path(skill["path"]) / "references" / "quick-rules.md"
          if not quick_rules.is_file():
              raise SystemExit("humanize-korean references were not materialized")
          PY

      - name: Run deterministic tests
        run: uv run --locked --no-default-groups --group test pytest -q tests

      - name: Validate canonical Rulesync source
        if: steps.scope.outputs.rulesync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mise install node rumdl "npm:rulesync"
          mapfile -d '' markdown < <(git ls-files -z -- 'src/rulesync/**/*.md')
          if ((${#markdown[@]})); then
            rumdl fmt "${markdown[@]}"
            git diff --exit-code -- "${markdown[@]}"
          fi
          npm run rulesync:doctor

      - name: Validate distribution routes
        if: steps.scope.outputs.routes == 'true'
        run: |
          uv run --no-project --with "pyyaml>=6.0.2" python scripts/generate_distribution_routes.py
          git diff --exit-code -- route/skills.jsonl

      - name: Validate changed Markdown normalization
        if: steps.scope.outputs.markdown == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mise install rumdl
          mapfile -d '' markdown < <(
            git diff --name-only -z --diff-filter=ACMR HEAD^1 HEAD -- '*.md'
          )
          if ((${#markdown[@]})); then
            rumdl fmt "${markdown[@]}"
            git diff --exit-code -- "${markdown[@]}"
          fi

      - name: Run mols-rpi Promptfoo smoke
        if: steps.scope.outputs.promptfoo == 'true'
        run: |
          mise install node
          npm run eval:promptfoo:mols-rpi:smoke
