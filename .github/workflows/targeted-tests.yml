name: Targeted PR Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agentsmesh/rules/**"
      - ".agentsmesh/skills/**"
      - ".agentsmesh/agents/**"
      - "agentsmesh.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".github/agents/**"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - "evals/regression/**"
      - "evals/skills/**"
      - "tests/test_agentsmesh_exodus.py"
      - "docs/README.md"
      - "docs/development.md"
      - "docs/testing.md"
      - "docs/skills/**"
      - "docs/references/skills/**"
      - "docs/references/common/standards/agent-assets-standard-personal.md"
      - "scripts/**"
      - "tests/skills/**"
      - "tests/scripts/**"
      - ".github/workflows/targeted-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select affected tests
        id: scope
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only -z HEAD^1 HEAD)
          declare -A root_targets=()

          add_exodus() {
            root_targets["tests/test_agentsmesh_exodus.py"]=1
          }

          add_asset_docs() {
            root_targets["tests/scripts/asset_docs_placement"]=1
          }

          add_skill() {
            local name="$1"
            [[ -d "tests/skills/$name" ]] && root_targets["tests/skills/$name"]=1
            return 0
          }

          add_script() {
            local name="$1"
            [[ -d "tests/scripts/$name" ]] && root_targets["tests/scripts/$name"]=1
            return 0
          }

          for path in "${files[@]}"; do
            case "$path" in
              tests/skills/conftest.py)
                root_targets["tests/skills"]=1
                ;;
              tests/scripts/conftest.py)
                root_targets["tests/scripts"]=1
                ;;
              .github/workflows/targeted-tests.yml)
                add_exodus
                add_asset_docs
                ;;
              .agentsmesh/skills/*)
                name="${path#*/skills/}"
                add_skill "${name%%/*}"
                add_exodus
                add_asset_docs
                ;;
              tests/skills/*|evals/skills/*)
                name="${path#*/skills/}"
                add_skill "${name%%/*}"
                ;;
              .agentsmesh/rules/*|.agentsmesh/agents/*|agentsmesh.yaml|package.json|package-lock.json|.github/copilot-instructions.md|.github/skills/*|.github/agents/*|.agents/rules/*|.agents/skills/*|evals/regression/*|tests/test_agentsmesh_exodus.py)
                add_exodus
                ;;
              docs/skills/*|docs/references/skills/*|docs/references/common/standards/agent-assets-standard-personal.md|docs/README.md|docs/development.md|docs/testing.md)
                add_asset_docs
                ;;
              tests/scripts/*)
                name="${path#*/scripts/}"
                add_script "${name%%/*}"
                ;;
              scripts/*)
                name="${path#scripts/}"
                name="${name%.py}"
                add_script "${name%%/*}"
                ;;
            esac
          done

          if ((${#root_targets[@]})); then
            printf '%s\0' "${!root_targets[@]}" > /tmp/root-tests
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Run central tests
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          [[ -f /tmp/root-tests ]] || exit 0
          mapfile -d '' targets < /tmp/root-tests
          uv run --frozen --no-default-groups --group test pytest -q "${targets[@]}"
