name: Branch Check

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-check:
    name: Branch Check
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Validate source contracts
        run: uv run --locked --no-default-groups --group test python scripts/docs_frontmatter_validate.py

      - name: Run deterministic tests
        run: uv run --locked --no-default-groups --group test pytest -q tests

      - name: Validate local generated projections
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_validate --local-only --all
