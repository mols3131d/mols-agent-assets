name: Branch Check

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-check:
    name: Branch Check
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: "2026.10.25"
          install: false
          cache: true

      - name: Install source quality tools
        run: mise install node rumdl "npm:@biomejs/biome"

      - name: Validate pushed source quality
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            if ! before="$(git merge-base HEAD origin/main)"; then
              echo "No common base with main; checking all tracked sources."
              mise run quality-check --all
              exit 0
            fi
          fi
          mise run quality-check --changed-from "$before"

      - name: Validate source contracts
        run: uv run --locked --no-default-groups --group test python scripts/docs_frontmatter_validate.py

      - name: Run deterministic tests
        run: uv run --locked --no-default-groups --group test pytest -q tests

      - name: Validate local generated projections
        run: uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts validate --local-only --all
