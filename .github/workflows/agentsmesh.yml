name: AgentsMesh

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agentsmesh/**"
      - "agentsmesh.yaml"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".rumdl.toml"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".github/workflows/agentsmesh.yml"
      - ".github/workflows/rumdl-main-autofix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize canonical Markdown
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown < <(git ls-files -z -- '.agentsmesh/**/*.md')
          ((${#markdown[@]})) || exit 0
          uvx rumdl@0.2.6 fmt "${markdown[@]}"
      - name: Regenerate projections
        run: |
          npx agentsmesh lint
          npx agentsmesh generate
          python scripts/generate_skill_indexes.py
      - name: Probe generated rumdl idempotence
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            .agentsmesh \
            .github/copilot-instructions.md \
            .github/agents \
            .github/skills \
            .agents/rules \
            .agents/skills

          mapfile -d '' markdown < <(git ls-files -z -- '*.md')
          managed=()
          for file in "${markdown[@]}"; do
            source_attr="$(git check-attr agentsmesh-source -- "$file")"
            generated_attr="$(git check-attr linguist-generated -- "$file")"
            if [[ "$source_attr" == *": agentsmesh-source: set" ]] || \
               [[ "$generated_attr" == *": linguist-generated: set" ]]; then
              managed+=("$file")
            fi
          done

          ((${#managed[@]})) || exit 0
          uvx rumdl@0.2.6 fmt "${managed[@]}"
          echo "rumdl post-generation changes:"
          git diff --name-only -- "${managed[@]}"
          npx agentsmesh check
          npx agentsmesh generate --check
      - name: Validate focused contracts
        run: >-
          uv run --frozen --no-default-groups --group test pytest -q
          tests/skills/mols-skill-find
          tests/skills/mols-skill-install
          tests/scripts/rumdl_main_autofix
          tests/evals
          tests/test_agentsmesh_exodus.py
          tests/scripts/generate_skill_indexes
      - name: Commit normalized state
        shell: bash
        run: |
          rm -f .agentsmeshcache
          git add -A -- \
            .agentsmesh \
            .github/copilot-instructions.md \
            .github/agents \
            .github/skills \
            .agents/rules \
            .agents/skills
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize AgentsMesh Markdown"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
