name: AgentsMesh

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agentsmesh/**"
      - "agentsmesh.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".github/workflows/agentsmesh.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile generated state
        run: |
          npx agentsmesh lint
          npx agentsmesh generate
          python scripts/generate_skill_indexes.py
          npx agentsmesh check
          npx agentsmesh generate --check
      - name: Validate focused contracts
        run: >-
          uv run --frozen --no-default-groups --group test pytest -q
          tests/skills/mols-skill-find
          tests/scripts/rumdl_main_autofix
          tests/test_agentsmesh_exodus.py
          tests/scripts/generate_skill_indexes
      - name: Commit generated state
        shell: bash
        run: |
          rm -f .agentsmeshcache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .agentsmesh/.lock \
            .agentsmesh/skills/INDEX.jsonl \
            .github/copilot-instructions.md \
            .github/agents \
            .github/skills \
            .agents/rules \
            .agents/skills
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore: reconcile generated agent assets"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
