name: AgentsMesh

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agentsmesh/**"
      - "agentsmesh.yaml"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".rumdl.toml"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".github/workflows/agentsmesh.yml"
      - ".github/workflows/rumdl-main-autofix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate canonical Markdown formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown < <(git ls-files -z -- '.agentsmesh/**/*.md')
          ((${#markdown[@]})) || exit 0
          uvx rumdl@0.2.6 check "${markdown[@]}"
      - name: Validate canonical configuration
        run: npx agentsmesh lint
      - name: Validate generated drift
        run: npx agentsmesh check
      - name: Validate regeneration
        run: npx agentsmesh generate --check
      - name: Validate generated Markdown formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown < <(git ls-files -z -- '*.md')
          generated=()
          for file in "${markdown[@]}"; do
            attr="$(git check-attr linguist-generated -- "$file")"
            [[ "$attr" == *": linguist-generated: set" ]] && generated+=("$file")
          done
          ((${#generated[@]})) || exit 0
          uvx rumdl@0.2.6 check "${generated[@]}"
      - name: Verify Copilot round trip
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.github"
          cp "$root/agentsmesh.yaml" "$tmp/agentsmesh.yaml"
          cp "$root/.github/copilot-instructions.md" "$tmp/.github/copilot-instructions.md"
          cp -R "$root/.github/agents" "$tmp/.github/agents"
          cp -R "$root/.github/skills" "$tmp/.github/skills"
          (
            cd "$tmp"
            "$root/node_modules/.bin/agentsmesh" import --from copilot
            "$root/node_modules/.bin/agentsmesh" generate
          )
          diff -u "$root/.github/copilot-instructions.md" "$tmp/.github/copilot-instructions.md"
          diff -ru "$root/.github/agents" "$tmp/.github/agents"
          diff -ru "$root/.github/skills" "$tmp/.github/skills"
      - name: Verify Antigravity round trip
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.agents"
          cp "$root/agentsmesh.yaml" "$tmp/agentsmesh.yaml"
          cp -R "$root/.agents/rules" "$tmp/.agents/rules"
          cp -R "$root/.agents/skills" "$tmp/.agents/skills"
          (
            cd "$tmp"
            "$root/node_modules/.bin/agentsmesh" import --from antigravity
            "$root/node_modules/.bin/agentsmesh" generate
          )
          diff -ru "$root/.agents/rules" "$tmp/.agents/rules"
          diff -ru "$root/.agents/skills" "$tmp/.agents/skills"
