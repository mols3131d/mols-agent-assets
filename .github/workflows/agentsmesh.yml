name: AgentsMesh

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/agentsmesh/**"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".rumdl.toml"
      - "scripts/run_agentsmesh.py"
      - ".github/workflows/agentsmesh.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate canonical Markdown normalization
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown < <(git ls-files -z -- 'src/agentsmesh/**/*.md')
          ((${#markdown[@]})) || exit 0
          uvx rumdl@0.2.6 fmt "${markdown[@]}"
          git diff --exit-code -- "${markdown[@]}"
      - name: Validate canonical configuration
        run: npm run agentsmesh:lint
      - name: Validate isolated projection consistency
        run: npm run agentsmesh:validate
