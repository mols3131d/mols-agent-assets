name: AgentsMesh

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agentsmesh/**"
      - "agentsmesh.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".github/workflows/agentsmesh.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate canonical configuration
        run: npx agentsmesh lint
      - name: Validate generated drift
        run: npx agentsmesh check
      - name: Validate regeneration
        run: npx agentsmesh generate --check
