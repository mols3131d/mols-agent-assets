name: AgentsMesh

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agentsmesh/**"
      - "agentsmesh.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".github/workflows/agentsmesh.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Apply canonical Skill fixes
        run: python scripts/tmp_skill_contract_fix.py
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate focused repository contracts
        run: >-
          uv run --frozen --no-default-groups --group test pytest -q
          tests/scripts/asset_docs_placement
          tests/skills/artifact-consistency-inspector
          tests/skills/writing
      - name: Regenerate target projections
        run: |
          npx agentsmesh lint
          npx agentsmesh generate
          python scripts/generate_skill_indexes.py
          npx agentsmesh check
          npx agentsmesh generate --check
      - name: Revalidate after generation
        run: >-
          uv run --frozen --no-default-groups --group test pytest -q
          tests/scripts/asset_docs_placement
          tests/skills/artifact-consistency-inspector
          tests/skills/writing
      - name: Commit reconciled state
        shell: bash
        run: |
          git show HEAD^:.github/workflows/agentsmesh.yml > .github/workflows/agentsmesh.yml
          git show d224380456fa89458271b0b1a0cec9a8f2932ca0:.github/workflows/targeted-tests.yml > .github/workflows/targeted-tests.yml
          rm -f .github/workflows/tmp-skill-contract-fix.yml scripts/tmp_skill_contract_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce canonical skill package contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate canonical configuration
        run: npx agentsmesh lint
      - name: Validate generated drift
        run: npx agentsmesh check
      - name: Validate regeneration
        run: npx agentsmesh generate --check
      - name: Verify Copilot round trip
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.github"
          cp "$root/agentsmesh.yaml" "$tmp/agentsmesh.yaml"
          cp "$root/.github/copilot-instructions.md" "$tmp/.github/copilot-instructions.md"
          cp -R "$root/.github/agents" "$tmp/.github/agents"
          cp -R "$root/.github/skills" "$tmp/.github/skills"
          (
            cd "$tmp"
            "$root/node_modules/.bin/agentsmesh" import --from copilot
            "$root/node_modules/.bin/agentsmesh" generate
          )
          diff -u "$root/.github/copilot-instructions.md" "$tmp/.github/copilot-instructions.md"
          diff -ru "$root/.github/agents" "$tmp/.github/agents"
          diff -ru "$root/.github/skills" "$tmp/.github/skills"
      - name: Verify Antigravity round trip
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.agents"
          cp "$root/agentsmesh.yaml" "$tmp/agentsmesh.yaml"
          cp -R "$root/.agents/rules" "$tmp/.agents/rules"
          cp -R "$root/.agents/skills" "$tmp/.agents/skills"
          (
            cd "$tmp"
            "$root/node_modules/.bin/agentsmesh" import --from antigravity
            "$root/node_modules/.bin/agentsmesh" generate
          )
          diff -ru "$root/.agents/rules" "$tmp/.agents/rules"
          diff -ru "$root/.agents/skills" "$tmp/.agents/skills"
