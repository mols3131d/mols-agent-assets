name: Generate Distribution Routes

on:
  push:
    paths:
      - "src/rulesync/.rulesync/skills/*/SKILL.md"
      - "scripts/generate_distribution_routes.py"
      - ".github/workflows/distribution-routes.yml"

permissions:
  contents: write

concurrency:
  group: distribution-routes-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Generate distribution routes
        run: >-
          uv run --no-project --with "pyyaml>=6.0.2"
          python scripts/generate_distribution_routes.py
      - name: Commit changed routes
        shell: bash
        run: |
          routes=(route/skills.jsonl)
          [[ -z "$(git status --porcelain -- "${routes[@]}")" ]] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${routes[@]}"
          git commit -m "chore: update distribution routes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
