name: Temporary uv lock refresh

on:
  push:
    branches:
      - chatbot/feat/mise-tooling
    paths:
      - pyproject.toml
      - .github/workflows/refresh-uv-lock-temp.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Refresh uv.lock
        run: uv lock
      - name: Commit lockfile
        shell: bash
        run: |
          git diff --quiet -- uv.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "chore(tooling): refresh uv lock"
          git push origin HEAD:chatbot/feat/mise-tooling
