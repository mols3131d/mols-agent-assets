name: rumdl Main Auto-Fix

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Format changed Markdown
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BEFORE"
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR "$BEFORE" "$AFTER" -- '*.md'
          )
          ((${#files[@]})) && uvx rumdl@0.2.6 fmt "${files[@]}"

      - name: Commit fixes
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(markdown): auto-fix with rumdl"
          git pull --rebase origin main
          git push origin HEAD:main
