name: rumdl Main Auto-Fix

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Format changed Markdown
        id: markdown
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BEFORE"
          mapfile -d '' candidates < <(
            git diff --name-only -z --diff-filter=ACMR "$BEFORE" "$AFTER" -- '*.md'
          )

          files=()
          agentsmesh_source_changed=false
          for file in "${candidates[@]}"; do
            source_attr="$(git check-attr agentsmesh-source -- "$file")"
            generated_attr="$(git check-attr linguist-generated -- "$file")"

            [[ "$source_attr" == *": agentsmesh-source: set" ]] && agentsmesh_source_changed=true
            [[ "$generated_attr" == *": linguist-generated: set" ]] && continue
            files+=("$file")
          done

          ((${#files[@]})) && uvx rumdl@0.2.6 fmt "${files[@]}"
          echo "agentsmesh_source_changed=$agentsmesh_source_changed" >> "$GITHUB_OUTPUT"

      - name: Refresh Skill index
        if: steps.markdown.outputs.agentsmesh_source_changed == 'true'
        run: uv run --no-project --with "pyyaml>=6.0.2" python scripts/generate_skill_indexes.py

      - name: Commit fixes
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(markdown): auto-fix with rumdl"
          git pull --rebase origin main
          git push origin HEAD:main
