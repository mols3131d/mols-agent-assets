name: rumdl Main Auto-Fix

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: rumdl-main-autofix
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect changed Markdown
        id: markdown
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE"
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR "$BEFORE" "$AFTER" -- '*.md'
          )

          if ((${#files[@]} == 0)); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\0' "${files[@]}" > /tmp/markdown-files
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.markdown.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v9.0.0

      - name: Format Markdown
        if: steps.markdown.outputs.changed == 'true'
        shell: bash
        run: |
          mapfile -d '' files < /tmp/markdown-files
          uvx rumdl@0.2.6 fmt "${files[@]}"

      - name: Commit fixes
        if: steps.markdown.outputs.changed == 'true'
        shell: bash
        run: |
          mapfile -d '' files < /tmp/markdown-files
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style(markdown): auto-fix with rumdl"
          git pull --rebase origin main
          git push origin HEAD:main
