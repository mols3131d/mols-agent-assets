name: rumdl Main Auto-Fix

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Collect changed Markdown
        id: markdown
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR "$BEFORE" "$AFTER" -- '*.md'
          )

          if ((${#files[@]} == 0)); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\0' "${files[@]}" > /tmp/markdown-files
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Format Markdown
        if: steps.markdown.outputs.changed == 'true'
        shell: bash
        run: |
          mapfile -d '' files < /tmp/markdown-files
          uv run --frozen --group dev rumdl fmt "${files[@]}"

      - name: Commit fixes
        if: steps.markdown.outputs.changed == 'true'
        run: |
          if git diff --quiet -- '*.md'; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "style(markdown): auto-fix with rumdl"
          git push origin HEAD:main
