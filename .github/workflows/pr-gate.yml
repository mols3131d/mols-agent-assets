name: PR Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Validate source contracts
        run: uv run --locked --no-default-groups --group test python scripts/docs_frontmatter_validate.py

      - name: Run deterministic tests
        run: uv run --locked --no-default-groups --group test pytest -q tests

      - name: Validate affected generated projections
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts_validate --changed-from "$base_sha"

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: false
          cache: true

      - name: Install Rulesync validation tools
        run: mise install node "npm:rulesync"

      - name: Validate Rulesync-managed assets
        run: npm run rulesync:validate
