name: PR Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: "2026.10.25"
          install: false
          cache: true

      - name: Install validation tools
        run: mise install node rumdl "npm:@biomejs/biome" "npm:rulesync"

      - name: Validate Biome configuration
        run: mise exec -- biome check biome.json .vscode/tasks.json

      - name: Validate changed source quality
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          mise run quality-check --changed-from "$base_sha"

      - name: Validate source contracts
        run: uv run --locked --no-default-groups --group test python scripts/docs_frontmatter_validate.py

      - name: Run deterministic tests
        run: uv run --locked --no-default-groups --group test pytest -q tests

      - name: Validate affected generated projections
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          uv run --locked --no-default-groups --group test python -m scripts.generated_artifacts validate --changed-from "$base_sha"

      - name: Validate changed Lefthook configuration
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          if git diff --quiet "$base_sha" HEAD -- lefthook.yml .lefthook mise.toml .github/workflows/pr-gate.yml; then
            echo "Lefthook inputs unchanged; skipping."
          else
            mise install lefthook
            mise exec -- lefthook validate
            sh -n .lefthook/pre-commit/source-quality.sh
          fi

      - name: Validate project requirements with mise Doctor
        run: mise doctor project

      - name: Validate locked root Rulesync dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          if git diff --quiet "$base_sha" HEAD -- rulesync.jsonc rulesync.lock mise.toml .github/workflows/pr-gate.yml; then
            echo "Root Rulesync inputs unchanged; skipping dependency installation."
            exit 0
          fi
          lock_checksum="$(sha256sum rulesync.lock)"
          rulesync install --frozen
          printf '%s\n' "$lock_checksum" | sha256sum --check

      - name: Validate Rulesync-managed assets
        run: mise run rulesync-validate
