name: Rulesync

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/rulesync/**"
      - "package.json"
      - "mise.toml"
      - ".gitattributes"
      - ".rumdl.toml"
      - "scripts/run_rulesync.py"
      - ".github/workflows/rulesync.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install: false
          cache: true
      - name: Install verification tools
        run: mise install uv node rumdl "npm:rulesync"
      - name: Validate canonical Markdown normalization
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' markdown < <(git ls-files -z -- 'src/rulesync/**/*.md')
          ((${#markdown[@]})) || exit 0
          rumdl fmt "${markdown[@]}"
          git diff --exit-code -- "${markdown[@]}"
      - name: Validate canonical configuration
        run: npm run rulesync:doctor
