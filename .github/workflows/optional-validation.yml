name: Optional Validation

on:
  workflow_dispatch:
    inputs:
      docs_indexes:
        description: Validate committed docs indexes
        required: false
        default: false
        type: boolean
      routes:
        description: Regenerate committed routes and compare
        required: false
        default: false
        type: boolean
      rulesync:
        description: Run strict Rulesync doctor
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.docs_indexes || inputs.routes || inputs.rulesync }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        if: ${{ inputs.docs_indexes || inputs.routes }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Validate docs indexes
        if: ${{ inputs.docs_indexes }}
        run: uv run --locked --no-default-groups --group test python scripts/generate_docs_indexes.py --check

      - name: Validate routes
        if: ${{ inputs.routes }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-default-groups --group test python scripts/generate_distribution_routes.py
          uv run --locked --no-default-groups --group test python scripts/generate_repository_routes.py
          git diff --exit-code -- route/*.jsonl .agents/route/*.jsonl

      - name: Set up mise
        if: ${{ inputs.rulesync }}
        uses: jdx/mise-action@v3
        with:
          install: false
          cache: true

      - name: Validate Rulesync source
        if: ${{ inputs.rulesync }}
        run: |
          mise install uv node "npm:rulesync"
          mise exec -- uv run --locked --no-default-groups python scripts/run_rulesync.py doctor
